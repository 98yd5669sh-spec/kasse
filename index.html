<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RP Bar Kasse</title>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#0b0b0b;
color:white;
}

/* Screens */
.screen{display:none;height:100vh;}
.active{display:block;}

/* SHIFT SCREEN */

#shiftScreen{
text-align:center;
padding-top:120px;
background:#0b0b0b;
}

#shiftScreen button{
background:#1f8ef1;
font-size:22px;
padding:18px 30px;
border-radius:14px;
}

/* TABLE VIEW */

.tables{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
padding:20px;
}

.table{
background:#1a1a1a;
border-radius:16px;
padding:30px 10px;
font-size:20px;
text-align:center;
border:2px solid #2a2a2a;
}

/* POS LAYOUT */

.pos{
display:flex;
height:100vh;
}

/* LEFT - CART */

.cart{
width:33%;
background:#111;
display:flex;
flex-direction:column;
padding:15px;
border-right:2px solid #1f1f1f;
}

.cart h2{
margin:5px 0 10px 0;
}

.cart-item{
display:flex;
justify-content:space-between;
padding:10px;
margin:4px 0;
background:#1b1b1b;
border-radius:10px;
}

.total{
margin-top:auto;
font-size:26px;
padding:15px;
background:#000;
border-radius:12px;
text-align:center;
}

/* RIGHT SIDE */

.right{
width:67%;
display:flex;
flex-direction:column;
}

/* CATEGORY BAR */

.categories{
display:flex;
overflow-x:auto;
background:#111;
padding:10px;
gap:10px;
border-bottom:2px solid #1f1f1f;
}

.categories button{
background:#222;
padding:12px 18px;
border-radius:12px;
white-space:nowrap;
}

/* PRODUCTS GRID */

.products{
flex:1;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
padding:12px;
overflow-y:auto;
}

.product{
background:#181818;
border-radius:14px;
padding:20px;
font-size:18px;
text-align:center;
border:2px solid #2a2a2a;
}

.product:active{
background:#1f8ef1;
}

/* BUTTONS */

button{
border:none;
color:white;
}

.action{
margin-top:8px;
padding:14px;
border-radius:12px;
font-size:16px;
}

.back{background:#444;}
.park{background:#a87900;}
.pay{background:#1faa59;}
.end{background:#8b1a1a;}

</style>
</head>

<body>

<!-- SCHICHT -->
<div id="shiftScreen" class="screen active">
<h1>🍹 RP Bar Kasse</h1>
<h2>Keine aktive Schicht</h2>
<button onclick="startShift()">▶ Schicht beginnen</button>
<br><br>
<button onclick="showShiftHistory()">📜 Alte Schichten</button>
</div>

<!-- TISCHE -->
<div id="tableScreen" class="screen">
<h1 style="text-align:center">Tische</h1>
<div class="tables" id="tables"></div>
</div>

<!-- POS -->
<div id="posScreen" class="screen">
<div class="pos">

<!-- LEFT CART -->
<div class="cart">
<button class="action back" onclick="backToTables()">⬅ Zurück</button>
<h2 id="tableName">Tisch</h2>
<button class="action end" onclick="endShift()">🧾 Schicht beenden</button>

<div id="cartItems"></div>

<div class="total" id="total">0 $</div>

<button class="action park" onclick="saveOrder()">Bestellung parken</button>
<button class="action pay" onclick="checkout()">Bezahlen</button>
</div>

<!-- RIGHT SIDE -->
<div class="right">

<div class="categories" id="categories"></div>
<div class="products" id="products"></div>

</div>

</div>
</div>

<script src="app.js"></script>
</body>
</html>
